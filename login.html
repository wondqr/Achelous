<h1>Temperature: <span id="t">--</span> °C</h1>
<small id="time"></small>
<script>
async function load() {
  const d = await (await fetch("/api/temp")).json();
  document.getElementById("t").textContent = d.temp ?? "--";
  document.getElementById("time").textContent = d.time ?? "";
}
load();
setInterval(load, 2000);
</script>
